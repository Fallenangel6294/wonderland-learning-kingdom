<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wonderland Learning Kingdom</title>
    
    <link rel="stylesheet" href="style.css">
    
    <meta
        name="description"
        content="Wonderland Learning Kingdom is a safe, colorful educational adventure for children ages 2-10."
    >
</head>

<body>

    <!-- Wonderland Kingdom Map -->
    <main class="kingdom" id="kingdomScreen">

        <img
            src="wonderland-map.png"
            alt="Map of Wonderland Learning Kingdom"
            class="kingdom-map"
        >

        <button
            class="location-button castle-button"
            id="storybookCastle"
            aria-label="Enter Storybook Castle"
        >
            Storybook Castle
        </button>

    </main>

<!-- Storybook Castle Interior -->
<main class="castle-screen" id="castleScreen">

    <button
        class="back-button"
        id="backToKingdom"
    >
        ← Back to Wonderland
    </button>

    <img
        src="castle-interior.png"
        alt="Inside the Storybook Castle throne room"
        class="castle-interior"
    >

    <!-- Throne Buttons -->

    <button
        class="throne-button king-throne"
        id="storyTimeButton"
        aria-label="Story Time"
    >
        Story Time
    </button>

    <button
        class="throne-button queen-throne"
        id="letterQuestButton"
        aria-label="Letter Quest"
    >
        Letter Quest
    </button>

    <button
        class="throne-button prince-throne"
        id="wordMatchButton"
        aria-label="Word Match"
    >
        Word Match
    </button>

    <button
        class="throne-button princess-throne"
        id="spellingButton"
        aria-label="Spelling Workshop"
    >
        Spelling Workshop
    </button>

</main> 
    <!-- Letter Quest -->
<main class="letter-quest-screen" id="letterQuestScreen">

    <button
        class="back-button"
        id="backToThroneRoom"
    >
        ← Back to Throne Room
    </button>

    <img
        src="letter-quest-balcony.png"
        alt="Magical balcony overlooking Wonderland"
        class="letter-quest-background"
    >

</main>

</body>
    <script src="script.js"></script>
</html>
