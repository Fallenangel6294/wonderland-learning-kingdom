<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wonderland Learning Kingdom</title>
    
    <link rel="stylesheet" href="style.css">
    
    <meta
        name="description"
        content="Wonderland Learning Kingdom is a safe, colorful educational adventure for children ages 2-10."
    >
</head>

<body>

    <!-- Wonderland Kingdom Map -->
    <main class="kingdom" id="kingdomScreen">

        <img
            src="wonderland-map.png"
            alt="Map of Wonderland Learning Kingdom"
            class="kingdom-map"
        >

        <button
            class="location-button castle-button"
            id="storybookCastle"
            aria-label="Enter Storybook Castle"
        >
            Storybook Castle
        </button>

    </main>

<!-- Storybook Castle Interior -->
<main class="castle-screen" id="castleScreen">

    <button
        class="back-button"
        id="backToKingdom"
    >
        ← Back to Wonderland
    </button>

    <img
        src="castle-interior.png"
        alt="Inside the Storybook Castle throne room"
        class="castle-interior"
    >

    <!-- Throne Buttons -->

    <button
        class="throne-button king-throne"
        id="storyTimeButton"
        aria-label="Story Time"
    >
        Story Time
    </button>

    <button
        class="throne-button queen-throne"
        id="letterQuestButton"
        aria-label="Letter Quest"
    >
        Letter Quest
    </button>

    <button
        class="throne-button prince-throne"
        id="wordMatchButton"
        aria-label="Word Match"
    >
        Word Match
    </button>

    <button
        class="throne-button princess-throne"
        id="spellingButton"
        aria-label="Spelling Workshop"
    >
        Spelling Workshop
    </button>

</main> 
    
    <!-- Story Time Library -->
<main class="story-time-screen" id="storyTimeScreen">

    <button
        class="back-button"
        id="backToThroneRoomFromStoryTime"
    >
        ← Back to Throne Room
    </button>

    <img
        src="story-time-library.png"
        alt="Magical Story Time library"
        class="story-time-library"
    >

    <!-- Story Choices -->

    <button
        class="story-book-button bunny-story-button"
        id="bunnyMissingMoonButton"
        aria-label="Read Bunny and the Missing Moon"
    >
        Bunny and the Missing Moon
    </button>

    <button
        class="story-book-button bear-story-button"
        id="bearAdventureButton"
        aria-label="Read Bear's Big Adventure"
    >
        Bear's Big Adventure
    </button>

    <button
        class="story-book-button butterfly-story-button"
        id="butterflyStoryButton"
        aria-label="Read The Little Butterfly"
    >
        The Little Butterfly
    </button>

</main>

    <!-- Bunny and the Missing Moon -->
<main class="bunny-story-screen" id="bunnyStoryScreen">

    <button
        class="back-button"
        id="backToStoryLibrary"
    >
        ← Back to Story Time
    </button>

    <div class="story-page">

        <img
            src="bunny-missing-moon-page-1.png"
            alt="Bunny standing outside the cottage at night while the moon is partly hidden by clouds"
            class="story-page-image"
        >
        <button
    class="story-hotspot moon-hotspot"
    id="moonHotspot"
    aria-label="Find the moon"
></button>
        

    </div>

</main>
    
 <!-- Letter Quest -->
<main class="letter-quest-screen" id="letterQuestScreen">

    <button
        class="back-button"
        id="backToThroneRoom"
    >
        ← Back to Throne Room
    </button>

    <img
        src="letter-quest-balcony.png"
        alt="Magical balcony overlooking Wonderland"
        class="letter-quest-background"
    >

    <!-- Letter Quest Welcome -->
    <section class="letter-quest-welcome" id="letterQuestWelcome">

        <div class="quest-scroll closed-scroll">

            <div class="scroll-content">

                <h1>🔤 Letter Quest</h1>

                <p>
                    A magical journey through letters!
                </p>

                <p class="bunny-message">
                    🐰 Are you ready to begin?
                </p>

                <button
                    class="start-quest-button"
                    id="startLetterQuest"
                >
                    ✨ START QUEST ✨
                </button>

            </div>

        </div>

    </section>

</main>

</body>
    <script src="script.js"></script>
</html>
